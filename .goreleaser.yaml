version: 2
project_name: promptly

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  # macOS — CGO required for golang.design/x/hotkey (Carbon API)
  - id: darwin
    main: ./cmd/promptly
    binary: promptly
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/meruem/prompt-builder-agent/internal/cli.version={{.Version}}

  # Linux + Windows — pure Go, no CGO needed
  - id: cross
    main: ./cmd/promptly
    binary: promptly
    goos: [linux, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/meruem/prompt-builder-agent/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: true   # publish after Tauri bundles are uploaded

brews:
  - name: promptly
    repository:
      owner: "{{ .Env.GITHUB_USERNAME }}"
      name: homebrew-promptly
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/{{ .Env.GITHUB_USERNAME }}/promptly"
    description: "AI prompt runner with recipe system — one keystroke away"
    license: MIT
    install: |
      bin.install "promptly"
    test: |
      system "#{bin}/promptly", "version"
