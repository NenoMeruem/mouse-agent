name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust / Tauri checks ───────────────────────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Cache Rust/Cargo dependencies for faster builds
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Rust stable toolchain (auto-installed via rust-toolchain or default)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Linux requires WebKit2GTK & other system deps for Tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Format check
      - name: Check formatting (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Lint
      - name: Clippy lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --all
