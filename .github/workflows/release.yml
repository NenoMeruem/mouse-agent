name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Tauri bundles (.app / .dmg / .deb / .AppImage / .exe / .msi) ─────────────
  # Each OS builds its own native package — cross-compilation is NOT supported by Tauri.
  tauri-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # → .app + .dmg  (arm64 — Apple Silicon)
          - os: ubuntu-22.04       # → .deb + .AppImage  (amd64)
          - os: windows-latest     # → .exe (NSIS) + .msi (WiX)  (amd64)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Cache Cargo/Rust for faster builds
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux: install system libraries required by WebKit2GTK (Tauri v2)
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Build and upload Tauri bundles to the GitHub release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing (uncomment & add secrets when ready) ────────
          # APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID:                   ${{ secrets.APPLE_ID }}
          # APPLE_ID_PASSWORD:          ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Promptly ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          tauriScript: cargo tauri
          args: --config '{"bundle":{"targets":["all"]}}'

  # ── Publish draft release after ALL platform builds succeed ──────────────────
  publish-release:
    needs: tauri-release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --repo "${{ github.repository }}"
